name: Upload Python Package

on:
  push:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-files-presence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Verify presence of essential files
        run: |
          essential_files=("requirements.txt" "README.md" "pyproject.toml")
          missing_files=()

          for file in "${essential_files[@]}"; do
              if [ ! -f "$file" ]; then
                  missing_files+=("$file")
              fi
          done

          if [ ! -d "tests" ]; then
              missing_files+=("tests (directory)")
          fi

          if [ ${#missing_files[@]} -ne 0 ]; then
              echo "❌ The following essential files or directories are missing:"
              for file in "${missing_files[@]}"; do
                  echo "- $file"
              done
              exit 1
          else
              echo "✅ All essential files and directories are present."
          fi

  black-format:
    runs-on: ubuntu-latest
    needs: verify-files-presence
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install black formatter
        run: |
          python -m pip install --upgrade pip
          python -m pip install black

      - name: Run black formatter
        run: |
          python -m black --check --diff --exclude "examples" .

  pylint:
    runs-on: ubuntu-latest
    needs: verify-files-presence
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install pylint
        run: |
          python -m pip install --upgrade pip
          python -m pip install pylint

      - name: Run pylint
        run: |
          python_files=$(find . -type f -name "*.py" -not -path "./.venv/*")
          python -m pylint $python_files \
            --disable=all \
            --enable=unused-import,wrong-import-order,unused-variable,import-outside-toplevel,missing-function-docstring,invalid-name \
            --good-names=X,X_train,X_test,X_valid

  requirements-check:
    runs-on: ubuntu-latest
    needs: verify-files-presence
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependency tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pipdeptree

      - name: Extract all dependencies and subdependencies
        run: |
          pipdeptree --freeze > dependency_tree.txt
          awk '{print $1}' dependency_tree.txt | cut -d'=' -f1 | sort -u > all_installed_packages.txt
          echo "📄 all_installed_packages.txt:"
          cat all_installed_packages.txt

      - name: Generate requirements from code imports
        run: |
          python -m pip install pipreqs urllib3==1.26.15
          pipreqs . --force --encoding=utf-8 --ignore .venv --savepath requirements_from_imports.txt

      - name: Extract package names from requirements files
        run: |
          grep -o '^[^=<>]*' all_installed_packages.txt | sed 's/-/_/g' | tr '[:upper:]' '[:lower:]' | sort -u > requirements_clean.txt
          grep -o '^[^=<>]*' requirements_from_imports.txt | sed 's/-/_/g' | tr '[:upper:]' '[:lower:]' | sort -u > imports_clean.txt
          echo "📄 requirements_clean.txt:"
          cat requirements_clean.txt
          echo "📄 imports_clean.txt:"
          cat imports_clean.txt

      - name: Check for missing top-level packages
        run: |
          comm -23 imports_clean.txt requirements_clean.txt > missing.txt
          if [ -s missing.txt ]; then
            echo "❌ The following packages are used in the code but missing from requirements.txt:"
            cat missing.txt
            exit 1
          else
            echo "✅ All used packages are listed in requirements.txt."
          fi

  pip-audit:
    runs-on: ubuntu-latest
    needs: verify-files-presence
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Run pip-audit
        uses: pypa/gh-action-pip-audit@v1.0.0
        with:
          inputs: requirements.txt

  mypy:
    runs-on: ubuntu-latest
    needs: verify-files-presence
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install mypy
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install mypy

      - name: Run mypy
        run: |
          python_files=$(find . -type f -name "*.py" -not -path "./.venv/*")
          python -m mypy $python_files

  bandit:
    runs-on: ubuntu-latest
    needs: verify-files-presence
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install bandit
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit

      - name: Run bandit
        run: |
          python -m bandit -r . -x ".venv,tests" -l -i

  pytest:
    runs-on: ubuntu-latest
    env:
      SEED: ${{ vars.TEST_SEED }}
    needs:
      - black-format
      - pylint
      - requirements-check
      - pip-audit
      - mypy
      - bandit
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run pytest
        run: |
          python -m pytest -v tests/

  release-build:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: pytest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Build release distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install --verbose build
          python -m build --verbose

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dists
          path: dist/
          retention-days: 14

  pypi-publish:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs:
      - release-build
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/kvbiii-plots

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7f25271a4aa483500f742f9492b2ab5648d61011 # v1.12.4
        with:
          packages-dir: dist/
